<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Placement Predictor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #eef5ff; /* Faint / Light Blue */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 12px;
            border: 3px solid #003366; /* Dark Blue Border */
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #003366;
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column; /* Centered & Eka khali ek */
        }

        label {
            font-weight: 600;
            color: #333333;
            margin-top: 12px;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        input[type="file"] {
            padding: 10px 12px;
            border: 1px solid #b0c4de;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
            outline: none;
        }

        input:focus {
            border-color: #003366;
        }

        button[type="submit"] {
            margin-top: 25px;
            padding: 12px;
            background-color: #003366;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button[type="submit"]:hover {
            background-color: #002244;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Placement Predictor</h2>
        <form action="/predict" method="POST" enctype="multipart/form-data">
            <label>Full Name:</label>
            <input type="text" name="name" required>

            <label>Email ID:</label>
            <input type="email" name="email" required>

            <label>CGPA:</label>
            <input type="number" step="0.01" name="cgpa" required>

            <label>Academic Projects Count:</label>
            <input type="number" name="projects" required>

            <label>Internships Count:</label>
            <input type="number" name="internships" required>

            <label>Upload Resume (PDF/DOCX):</label>
            <input type="file" name="resume" accept=".pdf, .docx" required>

            <button type="submit">Predict Placement</button>
        </form>
    </div>

</body>
</html>
